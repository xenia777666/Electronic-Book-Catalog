name: CD Deploy to Render

on:
  workflow_run:
    workflows: ["CI Build and Test"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master'))
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set."
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Wait for deployment
        run: sleep 40

      - name: Healthcheck
        env:
          RENDER_HEALTHCHECK_URL: ${{ secrets.RENDER_HEALTHCHECK_URL }}
        run: |
          if [ -z "$RENDER_HEALTHCHECK_URL" ]; then
            echo "RENDER_HEALTHCHECK_URL secret is not set."
            exit 1
          fi

          for i in {1..30}; do
            RESPONSE=$(curl --silent --show-error "$RENDER_HEALTHCHECK_URL" || true)
            if echo "$RESPONSE" | grep -q '"status":"UP"'; then
              echo "Healthcheck passed."
              exit 0
            fi
            echo "Healthcheck not ready (attempt $i/30)."
            sleep 20
          done

          echo "Healthcheck failed."
          exit 1
