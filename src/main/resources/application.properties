# Database — SPRING_DATASOURCE_URL is set by docker-entrypoint on Render; locally use DB_* or defaults below
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:library_db}?sslmode=${DB_SSL_MODE:disable}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.config=classpath:logback-spring.xml
logging.level.com.example.libraryapp=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ?????????? (????? ?????? ??????????)
spring.jpa.properties.hibernate.generate_statistics=true

# Server
server.port=${PORT:8080}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Demo catalog: fills DB once when there are zero books (enable on Render with APP_SEED_ENABLED=true)
app.seed.enabled=${APP_SEED_ENABLED:false}
